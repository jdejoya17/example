generatorName: python-flask     # the language and framework to generate code for
minimalUpdate: true             # generate only updated files
templateDir: openapi/templates  # mustach template directory
packageName: familyhub          # autogenerated files will be created in this directory
additionalProperties:
  pythonVersion: "3.11"         # python version used for the project
openapiGeneratorIgnoreList:     # files that should not be autogenerated
  - README.md
  - test-requirements.txt
  - tox.ini 
  - setup.py
  - .travis.yml
  - Dockerfile
  - .dockerignore
  - .gitignore
  - git_push.sh
  - familyhub/test/**
